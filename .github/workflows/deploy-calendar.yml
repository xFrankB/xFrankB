name: Deploy interactive contribution calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "calendar/**"
      - ".github/workflows/deploy-calendar.yml"
  workflow_run:
    workflows:
      - "Update contribution calendar"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./calendar"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
