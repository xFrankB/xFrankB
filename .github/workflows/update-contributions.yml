name: Update contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "README.es.md"
      - "assets/contributions*.svg"
      - "assets/*-es.svg"
      - "assets/*-es-light.svg"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: xFrankB
        run: python3 scripts/update_contributions.py

      - name: Commit changed calendar
        run: |
          if git diff --quiet -- assets/contributions.svg assets/contributions-light.svg; then
            echo "Contribution calendar is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/contributions-light.svg
          git commit -m "Update contribution calendar"
          git push
