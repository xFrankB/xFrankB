name: Update contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "README.es.md"
      - "assets/contributions*.svg"
      - "assets/*-es.svg"
      - "assets/*-es-light.svg"
      - "calendar/data.json"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution calendars, translations and technology orbit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: xFrankB
        run: python3 scripts/update_contributions.py

      - name: Build light theme variants
        run: python3 scripts/build_light_variants.py

      - name: Commit changed calendars and translations
        run: |
          if [ -z "$(git status --porcelain -- README.md README.es.md assets calendar)" ]; then
            echo "Contribution calendars are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.es.md assets calendar/data.json
          git commit -m "Update contribution calendars and translations"
          git push
