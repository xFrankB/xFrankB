<svg xmlns="http://www.w3.org/2000/svg" width="360" height="92" viewBox="0 0 360 92" role="img" aria-labelledby="title desc">
  <title id="title">Contacto · jfby13@gmail.com</title>
  <desc id="desc">Animated pill-shaped email link with monochrome envelope icon and cyan-white border beam.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17191d" stop-opacity=".98"/><stop offset="1" stop-color="#08090b" stop-opacity=".98"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#78efff" stop-opacity="0"/><stop offset=".42" stop-color="#b9f7ff"/><stop offset=".62" stop-color="#fff"/><stop offset=".82" stop-color="#63e7ff"/><stop offset="1" stop-color="#63e7ff" stop-opacity="0"/></linearGradient>
    <filter id="beamBlur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect x="2" y="2" width="356" height="88" rx="44"/></clipPath>
