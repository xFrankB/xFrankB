<svg xmlns="http://www.w3.org/2000/svg" width="360" height="92" viewBox="0 0 360 92" role="img" aria-labelledby="title desc">
  <title id="title">Contacto · jfby13@gmail.com</title>
  <desc id="desc">Monochrome contact panel with the same profile background, full perimeter beam and animated envelope icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="0.55" stop-color="#141414"/><stop offset="1" stop-color="#060606"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#777777" stop-opacity="0"/><stop offset=".43" stop-color="#cfcfcf"/><stop offset=".56" stop-color="#fff"/><stop offset=".74" stop-color="#8a8a8a"/><stop offset="1" stop-color="#8a8a8a" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".055"/><circle cx="1" cy="1" r="1" fill="#fff" opacity=".14"/></pattern>
    <filter id="blur32" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="beamBlur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <clipPath id="clip"><rect x="2" y="2" width="356" height="88" rx="24"/></clipPath>
  </defs>
  <rect width="360" height="92" fill="none"/>
  <g clip-path="url(#clip)">
    <rect x="2" y="2" width="356" height="88" rx="24" fill="url(#bg)"/>
    <rect x="2" y="2" width="356" height="88" rx="24" fill="url(#grid)"/>
    <g filter="url(#blur32)" opacity=".35">
      <circle cx="54" cy="24" r="52" fill="#fff"><animate attributeName="cx" values="54;92;54" dur="18s" repeatCount="indefinite"/></circle>
      <circle cx="308" cy="78" r="58" fill="#888"><animate attributeName="cy" values="78;54;78" dur="15s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="2" y="2" width="356" height="88" rx="24" fill="none" stroke="#fff" stroke-opacity=".2"/>
    <rect x="2" y="2" width="356" height="88" rx="24" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="7" filter="url(#blur10)"/>
    <rect x="2" y="2" width="356" height="88" rx="24" fill="none" stroke="url(#beam)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="72 546" pathLength="618" opacity=".9">
      <animate attributeName="stroke-dashoffset" values="0;-618" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="2" width="356" height="88" rx="24" fill="none" stroke="url(#beam)" stroke-width="7" stroke-linecap="round" stroke-dasharray="72 546" pathLength="618" opacity=".24" filter="url(#beamBlur)">
      <animate attributeName="stroke-dashoffset" values="0;-618" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(52 46)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3.7s" repeatCount="indefinite"/>
        <circle r="28" fill="#242a31" stroke="#fff" stroke-opacity=".2"/>
        <circle r="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
        <rect x="-17" y="-12" width="34" height="24" rx="5" fill="none" stroke="#fff" stroke-width="2.1"/>
        <path d="M-15-8L0 4 15-8M-14 9l11-9M14 9L3 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cy="4" r="2.3" fill="#fff"><animate attributeName="r" values="2.3;3.5;2.3" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle r="29" fill="none" stroke="#d6d6d6" stroke-width="1.2" opacity="0"><animate attributeName="r" values="28;34;28" dur="3.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".42;0;.42" dur="3.7s" repeatCount="indefinite"/></circle>
      </g>
    </g>
    <g font-family="monospace">
      <text x="96" y="39" fill="#fff" opacity=".58" font-size="13" letter-spacing="1.6">CONTACTO</text>
      <text x="96" y="64" fill="#fff" opacity=".96" font-size="17">jfby13@gmail.com</text>
    </g>
  </g>
</svg>
