    <ellipse cx="115" cy="-2" rx="105" ry="32" fill="#fff" opacity=".1" filter="url(#soft)"/>
    <rect x="2" y="2" width="356" height="88" rx="44" fill="none" stroke="#1d252d" stroke-width="2"/>
    <rect x="2" y="2" width="356" height="88" rx="44" fill="none" stroke="url(#beam)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="78 540" pathLength="618" opacity=".94">
      <animate attributeName="stroke-dashoffset" values="0;-618" dur="2.7s" repeatCount="indefinite"/>
    </rect>
