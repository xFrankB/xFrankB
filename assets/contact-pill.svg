    <path d="M24 88H92" fill="none" stroke="#8feeff" stroke-width="2" stroke-linecap="round" opacity=".25" filter="url(#accentBlur)">
      <animate attributeName="d" values="M24 88H60;M24 88H124;M24 88H60" dur="6.5s" repeatCount="indefinite"/>
