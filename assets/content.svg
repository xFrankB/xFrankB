<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">xFrankB profile content</title>
  <desc id="desc">Monochrome animated terminal panel with profile identity, focus, technology stack and contact information.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="0.55" stop-color="#141414"/><stop offset="1" stop-color="#060606"/></linearGradient>
    <filter id="blur32" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".055"/><circle cx="1" cy="1" r="1" fill="#fff" opacity=".14"/></pattern>
    <clipPath id="clip"><rect x="16" y="16" width="1168" height="708" rx="36"/></clipPath>
    <style>
      .mono { font-family: monospace; }
      .label { fill: #fff; opacity: .66; font-size: 14px; font-weight: 600; letter-spacing: 3px; }
      .body { fill: #fff; opacity: .86; font-size: 17px; }
      .muted { fill: #fff; opacity: .60; font-size: 14px; }
      .strong { fill: #fff; opacity: 1; font-size: 20px; font-weight: 700; }
      .line { stroke: #fff; stroke-opacity: .25; }
    </style>
  </defs>
  <rect width="1200" height="740" fill="none"/>
  <g clip-path="url(#clip)">
    <rect x="16" y="16" width="1168" height="708" rx="36" fill="url(#bg)"/>
    <rect x="16" y="16" width="1168" height="708" rx="36" fill="url(#grid)"/>
    <g filter="url(#blur32)" opacity=".18">
      <circle cx="170" cy="190" r="170" fill="#fff"><animate attributeName="cx" values="170;360;170" dur="18s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="500" r="190" fill="#888"><animate attributeName="cy" values="500;430;500" dur="15s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="16" y="16" width="1168" height="708" rx="36" fill="none" stroke="#fff" stroke-opacity=".2"/>
    <g class="mono">
      <text x="58" y="65" class="label">/ WHOAMI</text>
      <text x="58" y="105" class="strong">Francisco Baylón / xFrankB</text>
      <text x="58" y="140" class="body">Software developer trainee focused on full-stack products</text>
      <text x="58" y="168" class="body">and applied AI: interfaces, architecture, automation</text>
      <text x="58" y="196" class="body">and practical problem solving.</text>
      <text x="58" y="236" class="muted">$ mission: entender → construir → documentar → mejorar</text>

      <path d="M58 270H1142" class="line"/>
      <text x="58" y="310" class="label">/ FOCUS</text>
      <g transform="translate(58 342)">
        <text x="0" y="0" class="strong">01  WEB</text>
        <text x="0" y="30" class="muted">TypeScript · React · Vite</text>
        <text x="265" y="0" class="strong">02  BACKEND</text>
        <text x="265" y="30" class="muted">Node.js · Express</text>
        <text x="510" y="0" class="strong">03  AI / DATA</text>
        <text x="510" y="30" class="muted">Python · PyTorch · NumPy</text>
        <text x="820" y="0" class="strong">04  QUALITY</text>
        <text x="820" y="30" class="muted">Git · Linux · docs</text>
      </g>

      <path d="M58 412H1142" class="line"/>
      <text x="58" y="452" class="label">/ STACK</text>
      <text x="58" y="492" class="body">TypeScript · JavaScript · Python · C++ · React · Vite · Node.js</text>
      <text x="58" y="522" class="body">Express · PyTorch · NumPy · Pandas · Matplotlib · Scikit-learn</text>
      <text x="58" y="552" class="body">Git · Linux · pnpm · Tailwind CSS · VS Code</text>

      <path d="M58 594H1142" class="line"/>
      <text x="58" y="634" class="label">/ CONTACT</text>
      <a href="mailto:jfby13@gmail.com" aria-label="Enviar correo a jfby13@gmail.com"><text x="58" y="674" class="body">jfby13@gmail.com</text></a>
    </g>
    <rect x="16" y="16" width="1168" height="708" rx="36" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="7" filter="url(#blur10)"/>
    <rect x="30" y="16" width="2" height="708" fill="#fff" opacity=".09" filter="url(#blur10)">
      <animate attributeName="x" values="30;1168;30" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
