<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Proof of work — U3_APM</title>
  <desc id="desc">Animated monochrome proof panel describing the public U3_APM full-stack project and its verified structure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f3ef"/><stop offset="0.55" stop-color="#fbfbf8"/><stop offset="1" stop-color="#e7e7e2"/></linearGradient>
    <filter id="blur28" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#151515" stroke-opacity=".055"/><circle cx="1" cy="1" r="1" fill="#151515" opacity=".14"/></pattern>
    <clipPath id="clip"><rect x="16" y="16" width="1168" height="298" rx="32"/></clipPath>
    <style>
      .mono { font-family: monospace; }
      .label { fill: #151515; opacity: .66; font-size: 13px; font-weight: 600; letter-spacing: 3px; }
      .body { fill: #151515; opacity: .88; font-size: 17px; }
      .strong { fill: #151515; opacity: 1; font-size: 20px; font-weight: 700; }
      .muted { fill: #151515; opacity: .60; font-size: 14px; }
      .line { stroke: #151515; stroke-opacity: .25; }
    </style>
  </defs>
  <rect width="1200" height="330" fill="none"/>
  <g clip-path="url(#clip)">
    <rect x="16" y="16" width="1168" height="298" rx="32" fill="url(#bg)"/>
    <rect x="16" y="16" width="1168" height="298" rx="32" fill="url(#grid)"/>
    <g filter="url(#blur28)" opacity=".16">
      <circle cx="160" cy="45" r="105" fill="#151515"><animate attributeName="cx" values="160;280;160" dur="17s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="280" r="130" fill="#777777"><animate attributeName="cy" values="280;210;280" dur="14s" repeatCount="indefinite"/></circle>
    </g>
    <g class="mono">
      <text x="58" y="62" class="label">/ PRUEBA_DEL_TRABAJO</text>
      <text x="58" y="104" class="strong">U3_APM</text>
      <text x="58" y="132" class="body">Aplicación full-stack modular y preparada para crecer.</text>
      <text x="58" y="158" class="muted">repositorio público · main · MIT</text>
      <path d="M58 184H1142" class="line"/>
      <g transform="translate(58 224)">
        <text x="0" y="0" class="label">TYPE</text>
        <text x="0" y="30" class="strong">FULL-STACK</text>
        <text x="250" y="0" class="label">LENGUAJE_PRINCIPAL</text>
        <text x="250" y="30" class="strong">TYPESCRIPT 97%</text>
        <text x="545" y="0" class="label">ESTRUCTURA</text>
        <text x="545" y="30" class="strong">CLIENT / SERVER / SHARED</text>
        <text x="870" y="0" class="label">SCRIPTS</text>
        <text x="870" y="30" class="strong">DEV · BUILD · CHECK</text>
      </g>
      <text x="58" y="286" class="muted">arquitectura visible en el repo · límites modulares · comandos reproducibles</text>
    </g>
    <rect x="16" y="16" width="1168" height="298" rx="32" fill="none" stroke="#151515" stroke-opacity=".2"/>
    <rect x="16" y="16" width="1168" height="298" rx="32" fill="none" stroke="#151515" stroke-opacity=".045" stroke-width="7" filter="url(#blur8)"/>
    <rect x="30" y="16" width="2" height="298" fill="#151515" opacity=".08" filter="url(#blur8)"><animate attributeName="x" values="30;1168;30" dur="18s" repeatCount="indefinite"/></rect>
  </g>
</svg>
