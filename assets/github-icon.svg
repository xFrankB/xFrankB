<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">GitHub</title>
  <desc id="desc">Monochrome code mark linking to the GitHub profile.</desc>
  <circle cx="24" cy="24" r="20" fill="none" stroke="#fff" stroke-width="2" opacity=".82"/>
  <path d="M16 18l-7 6 7 6M32 18l7 6-7 6M27 13l-6 22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
