      </circle>
      <circle cx="650" cy="28" r="80" fill="url(#glowB)">
        <animate attributeName="r" values="80;120;80" dur="11s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path d="M18 282 C190 232 250 326 412 276 S704 204 860 270 S1060 328 1182 238" fill="none" stroke="#151515" stroke-opacity="0.16" stroke-width="1"/>
