        <circle cx="330.8" cy="110.4" r="4.4" fill="#ffffff" fill-opacity="0.98">
          <animate attributeName="opacity" values="0.48;1;0.48" dur="3.25s" begin="0.66s" repeatCount="indefinite"/>
        </circle>
        <text x="330.8" y="114.9" text-anchor="middle" fill="#ffffff" fill-opacity="1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="0.5">RE</text>
