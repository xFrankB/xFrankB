        <text x="167.9" y="62.7" text-anchor="middle" fill="#ffffff" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6.5" font-weight="700" letter-spacing="0.4">R</text>
