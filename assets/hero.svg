        </circle>
        <text x="222.3" y="69.4" text-anchor="middle" fill="#ffffff" fill-opacity="1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="0.5">JS</text>
        <animateTransform attributeName="transform" type="rotate" from="0 200 136" to="360 200 136" dur="17s" repeatCount="indefinite"/>
