        <animate attributeName="opacity" values="0.78;1;0.78" dur="4.6s" repeatCount="indefinite"/>
      </circle>
      <text x="200" y="140" text-anchor="middle" fill="#ffffff" fill-opacity="0.98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">TECH</text>
      <g transform="rotate(0 200 136)">
        <title>TypeScript detected in public repositories</title>
        <rect x="182.0" y="14.0" width="36" height="36" rx="11" fill="#050505" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.82" stroke-width="1.6"/>
        <circle cx="200.0" cy="32.0" r="4.4" fill="#ffffff" fill-opacity="0.98">
          <animate attributeName="opacity" values="0.48;1;0.48" dur="2.20s" begin="0.00s" repeatCount="indefinite"/>
