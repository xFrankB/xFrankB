<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Proyecto destacado — MindForce Grip</title>
  <desc id="desc">Panel monocromático animado que describe el sistema público MindForce Grip de seguimiento de rehabilitación para web y móvil.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="0.55" stop-color="#141414"/><stop offset="1" stop-color="#060606"/></linearGradient>
    <filter id="blur28" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".055"/><circle cx="1" cy="1" r="1" fill="#fff" opacity=".14"/></pattern>
    <clipPath id="clip"><rect x="16" y="16" width="1168" height="298" rx="32"/></clipPath>
    <style>.mono{font-family:monospace}.label{fill:#fff;opacity:.66;font-size:13px;font-weight:600;letter-spacing:3px}.body{fill:#fff;opacity:.88;font-size:17px}.strong{fill:#fff;opacity:1;font-size:20px;font-weight:700}.muted{fill:#fff;opacity:.60;font-size:14px}.line{stroke:#fff;stroke-opacity:.25}</style>
  </defs>
  <rect width="1200" height="330" fill="none"/>
  <g clip-path="url(#clip)">
    <rect x="16" y="16" width="1168" height="298" rx="32" fill="url(#bg)"/>
    <rect x="16" y="16" width="1168" height="298" rx="32" fill="url(#grid)"/>
    <g filter="url(#blur28)" opacity=".16"><circle cx="980" cy="54" r="110" fill="#fff"><animate attributeName="cx" values="980;860;980" dur="17s" repeatCount="indefinite"/></circle><circle cx="178" cy="280" r="130" fill="#888"><animate attributeName="cy" values="280;210;280" dur="14s" repeatCount="indefinite"/></circle></g>
    <g class="mono">
      <text x="58" y="62" class="label">/ PROYECTO_DESTACADO</text>
      <text x="58" y="104" class="strong">MINDFORCE_GRIP</text>
      <text x="58" y="132" class="body">Sistema multiplataforma de seguimiento para rehabilitación.</text>
      <text x="58" y="158" class="muted">repositorio público · web + móvil · datos de demostración</text>
      <path d="M58 184H1142" class="line"/>
      <g transform="translate(58 224)">
        <text x="0" y="0" class="label">ENTREGA</text><text x="0" y="30" class="strong">WEB + MÓVIL</text>
        <text x="250" y="0" class="label">NÚCLEO</text><text x="250" y="30" class="strong">FLUTTER / DART</text>
        <text x="545" y="0" class="label">BACKEND</text><text x="545" y="30" class="strong">SUPABASE</text>
        <text x="870" y="0" class="label">SALIDA</text><text x="870" y="30" class="strong">HISTORIAL PDF</text>
      </g>
      <text x="58" y="286" class="muted">autenticación · perfiles · seguimiento de progreso · exportación</text>
    </g>
    <rect x="16" y="16" width="1168" height="298" rx="32" fill="none" stroke="#fff" stroke-opacity=".2"/>
    <rect x="16" y="16" width="1168" height="298" rx="32" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="7" filter="url(#blur8)"/>
    <rect x="30" y="16" width="2" height="298" fill="#fff" opacity=".08" filter="url(#blur8)"><animate attributeName="x" values="30;1168;30" dur="18s" repeatCount="indefinite"/></rect>
  </g>
</svg>
