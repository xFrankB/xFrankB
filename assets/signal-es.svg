<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Verified technical signals — xFrankB</title>
  <desc id="desc">Animated monochrome technical signals panel with verified repository, stack and build loop information.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="0.55" stop-color="#141414"/><stop offset="1" stop-color="#060606"/></linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#fff" stroke-opacity=".055"/><circle cx="1" cy="1" r="1" fill="#fff" opacity=".14"/></pattern>
    <clipPath id="clip"><rect x="16" y="16" width="1168" height="218" rx="32"/></clipPath>
  </defs>
  <rect width="1200" height="250" fill="none"/>
  <g clip-path="url(#clip)">
    <rect x="16" y="16" width="1168" height="218" rx="32" fill="url(#bg)"/>
    <rect x="16" y="16" width="1168" height="218" rx="32" fill="url(#grid)"/>
    <g filter="url(#blur30)" opacity=".17">
      <circle cx="100" cy="40" r="90" fill="#fff"><animate attributeName="cx" values="100;250;100" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="214" r="120" fill="#777"><animate attributeName="cx" values="1080;940;1080" dur="16s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="monospace">
      <text x="52" y="58" fill="#fff" opacity=".7" font-size="13" font-weight="600" letter-spacing="3">SEÑAL_VERIFICADA / REPO_PÚBLICO</text>
      <g transform="translate(52 82)">
        <rect width="310" height="112" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".2"/>
        <text x="22" y="31" fill="#fff" opacity=".68" font-size="12" font-weight="600" letter-spacing="2">REPOSITORIO_PRINCIPAL</text>
        <text x="22" y="75" fill="#fff" font-size="27" font-weight="700">U3_APM</text>
        <circle cx="268" cy="70" r="10" fill="none" stroke="#fff" stroke-opacity=".35"/>
        <circle cx="268" cy="70" r="5" fill="#fff" opacity=".8"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.25;.8" dur="2.4s" repeatCount="indefinite"/></circle>
      </g>
      <g transform="translate(382 82)">
        <rect width="360" height="112" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".2"/>
        <text x="22" y="31" fill="#fff" opacity=".68" font-size="12" font-weight="600" letter-spacing="2">STACK_DETECTADO</text>
        <text x="22" y="73" fill="#fff" font-size="21" font-weight="600">TypeScript</text>
        <text x="22" y="98" fill="#fff" opacity=".62" font-size="12">React · Vite · Express · Node.js</text>
        <rect x="270" y="61" width="62" height="4" rx="2" fill="#fff" opacity=".2"/>
        <rect x="270" y="61" width="48" height="4" rx="2" fill="#fff"><animate attributeName="width" values="38;56;44;48" dur="5s" repeatCount="indefinite"/></rect>
      </g>
      <g transform="translate(762 82)">
        <rect width="386" height="112" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".2"/>
        <text x="22" y="31" fill="#fff" opacity=".68" font-size="12" font-weight="600" letter-spacing="2">CICLO_DE_BUILD</text>
        <text x="22" y="73" fill="#fff" font-size="19" font-weight="600">dev  →  build  →  check</text>
        <text x="22" y="98" fill="#fff" opacity=".62" font-size="12">format · comandos reproducibles</text>
        <path d="M314 70l16 0-6-6M330 70l-6 6" fill="none" stroke="#fff" stroke-width="1.6" opacity=".7"><animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="2.8s" repeatCount="indefinite"/></path>
      </g>
    </g>
    <rect x="16" y="16" width="1168" height="218" rx="32" fill="none" stroke="#fff" stroke-opacity=".18"/>
    <rect x="16" y="16" width="1168" height="218" rx="32" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="6" filter="url(#blur10)"/>
  </g>
</svg>
